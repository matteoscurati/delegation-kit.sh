name: Deploy

# Deploys the built site to Cloudflare Workers (Static Assets) on every push
# to main. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token with Workers Scripts:Edit and
#                          Workers Routes:Edit on the account and zone
#   CLOUDFLARE_ACCOUNT_ID  the account id
# and one optional repository variable:
#   PUBLIC_CF_BEACON_TOKEN the Web Analytics site token (off when unset)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Fail first, and say why, when the repository cannot deploy at all.
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::repository secrets missing:$missing (see the header of this workflow)"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      # The project's own wrangler (package.json), the one a local deploy
      # uses: wrangler-action installs an older one of its own, which fails
      # on an assets-only Worker with "Missing entry-point".
      - name: wrangler deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
